# Action Envelope - Evidence of work done
# Generated by g3 Plan Mode

facts:
  env_example:
    categories:
    - certifications
    - work_conditions
    - tech_experience
    - api_keys
    notes: All required variables documented
  ai_answerer:
    primary_provider: gemini-2.0-flash
    fallback_provider: claude-3-haiku
    caching: true
    cache_file: data/custom_answers.json
  answer_bank:
    patterns: 50+
    categories:
    - certifications
    - work_conditions
    - tech_skills
    - education
    - comfort_questions
    - work_auth
    profile_loading: YAML with dot notation
    years_rounding: UP (aggressive)
  screening_handler:
    question_types:
    - radio
    - select
    - text
    - number
    - checkbox
    - textarea
    detection_methods:
    - fieldset_legend
    - label_for
    - aria_label
    - parent_label
    logging: data/unknown_questions.json
  indeed_qa_system:
    architecture: 3-tier (AnswerBank -> CustomAnswers -> AI Fallback)
    files:
    - src/applier/answer_bank.py
    - src/applier/ai_answerer.py
    - src/applier/indeed_screening.py
    - src/bot/profile_interviewer.py
    data_files:
    - data/candidate/profile.yaml
    - data/custom_answers.json
    - data/unknown_questions.json
    - .env.example
  profile_interviewer:
    platform: Telegram
    interview_blocks:
    - certifications
    - work_conditions
    - tech_skills
    - open_ended
    output_format: YAML
    inline_keyboards: true
