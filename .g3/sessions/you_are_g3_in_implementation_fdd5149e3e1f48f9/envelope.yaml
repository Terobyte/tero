# Action Envelope - Evidence of work done
# Generated by g3 Plan Mode

facts:
  semantic_answer_bank:
    file: src/applier/semantic_answer_bank.py
    model: all-MiniLM-L6-v2
    vector_search: FAISS
    similarity_threshold: 0.78
    features:
    - regex fallback
    - semantic search
    - embedding cache
  slug_collection:
    scripts:
    - scripts/collect_cdx_slugs.py
    - scripts/validate_slugs.py
    ats_platforms:
    - greenhouse
    - lever
    - ashby
    source: Common Crawl CDX API
    tests: tests/scripts/test_cdx_slug_collector.py
  geo_consistency:
    file: src/stealth/geo_consistency.py
    features:
    - GeoConsistencyValidator
    - GeoCheckResult
    - US_STATE_TO_TIMEZONE mapping
    tests: tests/stealth/test_geo_consistency.py
    ip_lookup: ip-api.com
  api_changes:
    breaking: false
    new_dependencies:
    - httpx>=0.27.0
    - sentence-transformers>=3.0.0
    - faiss-cpu>=1.8.0
  webrtc_leak_prevention:
    flags:
    - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
    - --disable-webrtc-hide-local-ips-with-mdns
    file: src/stealth/browser_stealth.py
  fingerprint_protection:
    file: src/stealth/fingerprint_scripts.py
    scripts:
    - canvas_noise_script
    - audio_noise_script
    - battery_spoof_script
    injection: page.evaluate() after goto()
  screening_batch_validation:
    components:
    - QuestionIntentClassifier
    - SessionContext
    - BatchStepValidator
    files:
    - src/applier/universal_screening/question_intent.py
    - src/applier/universal_screening/session_context.py
    - src/applier/universal_screening/batch_validator.py
    - config/critical_intents.json
    tests: tests/applier/test_batch_validator.py
    critical_intents:
    - work_authorization
    - visa_sponsorship
    - security_clearance
    - criminal_history
  linkedin_voyager_api:
    file: src/platforms/linkedin_voyager.py
    features:
    - VoyagerSession
    - LinkedInVoyager
    - search_jobs
    - get_job_details
    tests: tests/platforms/test_linkedin_voyager.py
    speedup: 10x faster than browser scraping
  indeed_graphql_api:
    file: src/platforms/indeed_api.py
    endpoint: https://apis.indeed.com/graphql
    features:
    - IndeedAPISession
    - IndeedAPIClient
    - search_jobs
    tests: tests/platforms/test_indeed_api.py
