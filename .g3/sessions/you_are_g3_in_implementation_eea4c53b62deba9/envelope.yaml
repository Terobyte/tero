# Action Envelope - Evidence of work done
# Generated by g3 Plan Mode

facts:
  browser_module:
    file: gemini-research/browser.py
    class: StealthBrowser
    features:
    - anti_detection
    - session_storage_state
    - sync_patchright_api
    methods:
    - start(headless=False, session_path=None)
    - navigate(url)
    - load_session(path)
    - save_session(path)
    - close()
  gemini_research_automation:
    purpose: Automate Google Gemini Deep Research queries
    files:
    - gemini-research/deep_research.py
    - gemini-research/browser.py
    - gemini-research/extractor.py
    - gemini-research/requirements.txt
    capabilities:
    - login_flow
    - session_persistence
    - deep_research_automation
    - html_to_markdown_conversion
    - report_saving
    cli_usage:
      login: python deep_research.py --login
      research: python deep_research.py "query"
  dependencies:
  - patchright
  - html2text
  - click
  - loguru
  - python-slugify
  extractor_module:
    file: gemini-research/extractor.py
    class: ReportExtractor
    output_dir: ~/Desktop/Personal Researchs
    methods:
    - slugify(text)
    - extract(html, query)
    - generate_filename(query)
    - save_report(query, content)
    - save_markdown(query, markdown)
    output_format: YYYY-MM-DD_slug.md
