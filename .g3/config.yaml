defaults:
  max_rounds: 3
  max_turns: 10
  autonomous: false
  run_tests: true
  run_bug_detection: true
  ask_feedback: true
  player_provider: zai
  player_model: glm-5.1
  coach_provider: zai
  coach_model: glm-5.1
  verbose: false

providers:
  zai:
    type: claude_glm
    base_url: https://api.z.ai/api/anthropic
    model: glm-5.1
    small_model: glm-4.5-air
    claude_home: "~/.claude-zai"
    account_label: "zai"

  black:
    type: claude_glm
    command: ccg
    claude_home: "~/.claude-black"
    account_label: "blackbox"

  claude:
    type: claude_native
    command: claude
    claude_home: "~/.claude"
    default_model: sonnet
    default_timeout: 600

  codex:
    type: codex
    command: codex
    default_timeout: 900
    api_url: http://localhost:8317
    api_key: g3-local-key
    auto_start: true
    proxy_repo_path: ~/Desktop/Projects/Active/tero/ai-cli-proxy-api

  opencode:
    type: opencode_native
    command: opencode
    default_model: opencode/mimo-v2-pro-free
    default_timeout: 900

presets:
  default:
    player_provider: zai
    player_model: glm-5.1
    coach_provider: zai
    coach_model: glm-5.1
    max_rounds: 3
    run_tests: true

  fast:
    player_provider: zai
    player_model: glm-5.1
    coach_provider: zai
    coach_model: glm-5.1
    max_rounds: 1
    run_tests: false
    run_bug_detection: false

  pro:
    player_provider: zai
    player_model: glm-5.1
    coach_provider: claude
    coach_model: sonnet
    max_rounds: 3

  full_claude:
    player_provider: claude
    coach_provider: claude
    player_model: sonnet
    coach_model: opus
    max_rounds: 5

  mimo_free:
    player_provider: opencode
    player_model: opencode/mimo-v2-pro-free
    coach_provider: zai
    coach_model: glm-5.1
    max_rounds: 3

  kimi_free:
    player_provider: opencode
    player_model: openrouter/moonshotai/kimi-k2:free
    coach_provider: zai
    coach_model: glm-5.1
    max_rounds: 3
