* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --player: #5ac8fa; --judge: #c38bff; --tester: #ff8fc8; --gate: #ffb35c;
  --green: #3ddc84; --yellow: #f5c542; --red: #ff6b6b; --orange: #ff9f43; --grey: #8c94a1;
  --text: #f2f4f8; --dim: #9aa3b2; --faint: rgba(255,255,255,0.10);
  /* two sizes only: --big for what matters, --small for everything else */
  --big: 13px; --small: 11px;
}
html, body { background: transparent; height: 100%; overflow: hidden; }
body {
  font-family: "TeroGlass", -apple-system, "SF Pro Text", system-ui, sans-serif;
  font-size: var(--small); line-height: 1.4;
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
}
/* the card is the window: it stretches with every resize */
#card {
  height: 100vh; width: 100vw;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(20, 24, 32, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 10px 12px 10px;
  overflow: hidden;
}
#top { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#light {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  background: var(--grey);
}
#light.green { background: var(--green); box-shadow: 0 0 8px var(--green); animation: breathe 2.4s ease-in-out infinite; }
#light.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
#light.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
@keyframes breathe { 50% { opacity: 0.45; } }
#status { font-size: var(--big); font-weight: 600; white-space: nowrap; }
#status.green { color: var(--green); } #status.yellow { color: var(--yellow); }
#status.red { color: var(--red); } #status.grey { color: var(--grey); }
#age { color: var(--dim); white-space: nowrap; }
#age.age-yellow { color: var(--yellow); } #age.age-red { color: var(--red); }
#spacer { margin-left: auto; }
.btn {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--big); line-height: 1; color: var(--dim); cursor: pointer;
  background: var(--faint);
}
.btn:hover { background: rgba(255,255,255,0.22); color: var(--text); }
#plus { display: none; width: auto; padding: 0 6px; font-size: var(--small); }
#doing {
  font-size: var(--big); flex-shrink: 0;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
#card.expanded #doing { -webkit-line-clamp: 4; }
#doing[class^="r-"] { border-left: 2px solid; padding-left: 8px; }
#doing.r-player { border-color: var(--player); } #doing.r-judge { border-color: var(--judge); }
#doing.r-tester { border-color: var(--tester); } #doing.r-gate { border-color: var(--gate); }
#card.has-foot:not(.expanded) #doing { -webkit-line-clamp: 1; }
/* phases in one line: a dot per phase, the name of the current one only */
#phases { display: flex; align-items: center; gap: 4px; flex-shrink: 0; color: var(--dim); min-width: 0; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: var(--green); } .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.dot.red { background: var(--red); } .dot.orange { background: var(--orange); }
.dot.grey { background: rgba(255,255,255,0.22); }
.phase-name { margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#line2 { display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-width: 0; }
#line2 #phases { flex: 1; }
#model { font-size: var(--big); font-weight: 600; white-space: nowrap; flex-shrink: 0; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
#model.r-player { color: var(--player); } #model.r-judge { color: var(--judge); }
#model.r-tester { color: var(--tester); } #model.r-gate { color: var(--gate); }
#meta { display: none; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
#card.expanded #meta { display: block; }
#detail {
  display: none; flex: 1; min-height: 0; flex-direction: column;
  border-top: 1px solid var(--faint); padding-top: 6px;
}
#card.expanded #detail { display: flex; }
#log .r-player { color: var(--player); text-shadow: 0 0 6px rgba(90,200,250,0.55); }
#log .r-judge { color: var(--judge); text-shadow: 0 0 6px rgba(195,139,255,0.55); }
#log .r-tester { color: var(--tester); text-shadow: 0 0 6px rgba(255,143,200,0.55); }
#log .r-gate { color: var(--gate); text-shadow: 0 0 6px rgba(255,179,92,0.45); }
#log .tool { opacity: 0.6; text-shadow: none; }
#log {
  flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  color: #aeb7c6;
  -webkit-user-select: text; user-select: text;
}
/* the judge's verdict closes the card: green glow for SHIP, red for anything else */
#foot {
  display: none; flex-shrink: 0; font-weight: 600; padding: 4px 8px; border-radius: 7px;
  border: 1px solid currentColor;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* between verdicts the plate shows where the round is, in the acting role's color */
#foot.stage { color: var(--dim); border-color: var(--faint); font-weight: 400; }
#foot .sep { opacity: 0.5; margin: 0 4px; }
#foot .step.on { font-weight: 600; }
#foot.r-player { border-color: var(--player); box-shadow: 0 0 10px rgba(90,200,250,0.35); }
#foot.r-gate { border-color: var(--gate); box-shadow: 0 0 10px rgba(255,179,92,0.35); }
#foot.r-tester { border-color: var(--tester); box-shadow: 0 0 10px rgba(255,143,200,0.35); }
#foot.r-judge { border-color: var(--judge); box-shadow: 0 0 10px rgba(195,139,255,0.35); }
#foot .step.on.r-player { color: var(--player); text-shadow: 0 0 6px rgba(90,200,250,0.6); }
#foot .step.on.r-gate { color: var(--gate); text-shadow: 0 0 6px rgba(255,179,92,0.6); }
#foot .step.on.r-tester { color: var(--tester); text-shadow: 0 0 6px rgba(255,143,200,0.6); }
#foot .step.on.r-judge { color: var(--judge); text-shadow: 0 0 6px rgba(195,139,255,0.6); }
#foot.bad {
  color: var(--red); background: rgba(255, 107, 107, 0.14);
  box-shadow: 0 0 12px rgba(255, 107, 107, 0.45); text-shadow: 0 0 6px rgba(255, 107, 107, 0.6);
}
#foot.good {
  color: var(--green); background: rgba(61, 220, 132, 0.12);
  box-shadow: 0 0 12px rgba(61, 220, 132, 0.45); text-shadow: 0 0 6px rgba(61, 220, 132, 0.6);
}
</style>
</head>
<body>
<div id="card">
  <div id="top">
    <span id="light"></span>
    <span id="status"></span>
    <span id="age"></span>
    <span id="spacer"></span>
    <span id="plus" class="btn" title="другой прогон"></span>
    <span id="expand" class="btn" title="подробнее">▾</span>
    <span id="hide" class="btn" title="свернуть в меню-бар">–</span>
  </div>
  <div id="doing"></div>
  <div id="line2"><div id="phases"></div><span id="model"></span></div>
  <div id="meta"></div>
  <div id="detail">
    <div id="log"></div>
  </div>
  <div id="foot"></div>
</div>
<script>
var expanded = false;
var lastW = null, lastH = null;
var api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
function getApi() {
  if (!api && window.pywebview && window.pywebview.api) api = window.pywebview.api;
  return api;
}
window.addEventListener("pywebviewready", function () { getApi(); poll(); });

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
var ROLE_NAMES = {player: "игрок", judge: "судья", tester: "тестер", gate: "тесты"};
var VERDICT_SHOW_S = 60;
// [html, class]: a stop or a fresh verdict, else the round so far
function footOf(d, acting) {
  if (d.stop_text) return [esc(d.stop_text), "bad"];
  var v = d.verdict || {};
  var fresh = d.verdict_age_s != null && d.verdict_age_s < VERDICT_SHOW_S;
  if (v.verdict && (fresh || !acting)) {
    var cls = v.verdict === "SHIP" ? "good" : "bad";
    return [esc("судья: " + v.verdict + (v.blocking ? " · блокеров " + v.blocking : "") + (v.first ? " · " + v.first : "")), cls];
  }
  if (d.done_text) return [esc(d.done_text), "good"];
  if (!acting) return ["", ""];
  var steps = ["player", "gate", "judge"];
  if (acting === "tester") steps.splice(2, 0, "tester");
  var html = steps.map(function (r) {
    return '<span class="step' + (r === acting ? " on r-" + r : "") + '">' + ROLE_NAMES[r] + "</span>";
  }).join('<span class="sep">›</span>');
  return [html, "stage r-" + acting];
}
// the newest message types itself out; a longer message never takes more than ~1 s
var typing = {target: "", shown: 0, timer: null};
function typeDoing(text) {
  var el = document.getElementById("doing");
  if (text === typing.target) return;
  var keep = text.indexOf(typing.target.slice(0, typing.shown)) === 0 ? typing.shown : 0;
  typing.target = text;
  typing.shown = keep;
  if (typing.timer) clearInterval(typing.timer);
  var step = Math.max(1, Math.ceil((text.length - keep) / 50));
  typing.timer = setInterval(function () {
    typing.shown = Math.min(text.length, typing.shown + step);
    el.textContent = text.slice(0, typing.shown) + (typing.shown < text.length ? "▍" : "");
    if (typing.shown >= text.length) { clearInterval(typing.timer); typing.timer = null; }
  }, 20);
}
function ago(s) {
  return s < 60 ? s + " с назад" : Math.floor(s / 60) + " мин назад";
}
function render(d) {
  if (!d) return;
  expanded = !!d.expanded;
  var card = document.getElementById("card");
  var light = d.light || "grey";
  document.getElementById("light").className = light;
  // a green dot says "working" by itself: words only when something needs a look
  var st = document.getElementById("status");
  st.className = light;
  st.textContent = light === "green" ? "" : (d.light_text || "");
  typeDoing(d.doing || "");
  var acting = ROLE_NAMES[d.role] && (d.light === "green" || d.light === "yellow") ? d.role : "";
  document.getElementById("doing").className = acting ? "r-" + acting : "";

  var secs = d.sectors || [];
  var ph = document.getElementById("phases");
  ph.innerHTML = "";
  var curTitle = null;
  for (var j = 0; j < secs.length; j++) {
    var dot = document.createElement("span");
    dot.className = "dot " + (secs[j].color || "grey");
    dot.title = (j + 1) + ". " + (secs[j].title || "");
    ph.appendChild(dot);
    if (secs[j].color === "yellow") curTitle = secs[j].title || "";
  }
  if (curTitle !== null) {
    var label = document.createElement("span");
    label.className = "phase-name";
    label.textContent = curTitle;
    ph.appendChild(label);
  }

  // "player · opus": the role is already in the pill, the model gets its own place
  var model = document.getElementById("model");
  model.textContent = String(d.role_line || "").split(" · ").slice(1).join(" · ");
  model.className = acting ? "r-" + acting : "";
  // "Фаза 4/5 · раунд 1 · 22:07": the phase is already on top
  document.getElementById("meta").textContent = String(d.header || "").replace(/^Фаза [^·]*·\s*/, "");
  var age = document.getElementById("age");
  age.textContent = (d.last_event_age_s == null) ? "" : ago(d.last_event_age_s);
  age.className = "age-" + (d.age_color || "normal");

  var f = footOf(d, acting);
  var foot = document.getElementById("foot");
  foot.innerHTML = f[0];
  foot.className = f[1];
  foot.style.display = f[0] ? "block" : "none";
  card.className = (expanded ? "expanded " : "") + (f[0] ? "has-foot" : "");

  var plus = document.getElementById("plus");
  plus.textContent = d.plus || "";
  plus.style.display = d.plus ? "flex" : "none";
  document.getElementById("expand").textContent = expanded ? "▴" : "▾";
  if (!expanded) return;

  var items = ((d.tabs || {}).all) || [];
  var log = document.getElementById("log");
  var atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  var frag = document.createDocumentFragment();
  for (var m = Math.max(0, items.length - 60); m < items.length; m++) {
    var line = document.createElement("div");
    var r = items[m].role;
    // agent speech glows in its role color, tool calls stay dim
    line.className = (ROLE_NAMES[r] ? "r-" + r : "") + (items[m].type === "tool" ? " tool" : "");
    line.textContent = items[m].text || items[m].type || "";
    frag.appendChild(line);
  }
  log.innerHTML = "";
  log.appendChild(frag);
  if (atBottom) log.scrollTop = log.scrollHeight;
}
function call(name) {

  var a = getApi();
  if (!a || !a[name]) return null;
  try { return a[name].apply(a, [].slice.call(arguments, 1)); } catch (e) { return null; }
}
function after(p, fn) {
  if (p && typeof p.then === "function") p.then(fn); else fn(p);
}
function poll() {
  var a = getApi();
  if (!a) return;
  after(call("view"), function (d) { if (d) { window._last = d; render(d); } });
  if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
    lastW = window.innerWidth; lastH = window.innerHeight;
    call("save_size", lastW, lastH);
  }
}
document.getElementById("plus").onclick = function () {
  var a = getApi();
  if (!a) return;
  try { after(a.switch(""), poll); } catch (e) {}
};

  after(call("toggle"), function (v) { expanded = !!v; poll(); });
};
setInterval(poll, 1000);
poll();
</script>
