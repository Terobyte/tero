* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --player: #5ac8fa; --judge: #c38bff; --tester: #ff8fc8; --gate: #ffb35c;
  --green: #3ddc84; --yellow: #f5c542; --red: #ff6b6b; --orange: #ff9f43; --grey: #8c94a1;
  --ready: #dbedff; --host: #e8c48a;
  --text: #f2f4f8; --dim: #9aa3b2; --faint: rgba(255,255,255,0.10);
  /* two sizes only: --big for what matters, --small for everything else */
  --big: 13px; --small: 11px;
}
html, body { background: transparent; height: 100%; overflow: hidden; }
body {
  font-family: "TeroGlass", -apple-system, "SF Pro Text", system-ui, sans-serif;
  font-size: var(--small); line-height: 1.4;
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
}
/* the card is the window: it stretches with every resize */
#card {
  height: 100vh; width: 100vw;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(20, 24, 32, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 8px 12px;
  overflow: hidden; position: relative;
}
/* everything about the run in one line: health, phases, model, round, time */
#top { display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-width: 0; white-space: nowrap; }
/* the light is the hide button: one click and tero flies into the menu bar */
#light {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  background: var(--grey); position: relative; cursor: pointer;
  transition: transform 0.15s;
}
#light::after { content: ""; position: absolute; inset: -7px; }
#light:hover { transform: scale(1.3); }
#light.green { background: var(--green); box-shadow: 0 0 8px var(--green); animation: breathe 2.4s ease-in-out infinite; }
#light.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
#light.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
/* a finished run: its own steady glow, no breathing, no role colour */
#light.ready { background: var(--ready); box-shadow: 0 0 10px var(--ready); }
@keyframes breathe { 50% { opacity: 0.45; } }
#status { font-size: var(--big); font-weight: 600; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
#status:empty { display: none; }
#status.green { color: var(--green); } #status.yellow { color: var(--yellow); }
#status.red { color: var(--red); } #status.grey { color: var(--grey); }
#status.ready { color: var(--ready); }
/* the ✕ shows up only next to a ready light */
#close { display: none; }
#phases { display: flex; align-items: center; gap: 3px; flex: 1; min-width: 0; color: var(--dim); cursor: pointer; }
#phases:hover { color: var(--text); }
/* the plan slides down over the log on a click on the phases */
#plan {
  position: absolute; left: 8px; right: 8px; top: 34px; z-index: 5;
  background: rgba(28, 33, 44, 0.98); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  padding: 4px 6px; overflow-y: auto; max-height: calc(100vh - 44px);
  opacity: 0; transform: translateY(-8px) scaleY(0.92); transform-origin: top;
  pointer-events: none; transition: opacity 0.2s ease, transform 0.25s cubic-bezier(.2,.9,.3,1.2);
}
#plan.open { opacity: 1; transform: none; pointer-events: auto; }
.step { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px; }
.step + .step { border-top: 1px solid var(--faint); }
.step .n { color: var(--dim); width: 14px; text-align: right; flex-shrink: 0; }
.step .t { flex: 1; min-width: 0; font-size: var(--big); }
.step .s { color: var(--dim); flex-shrink: 0; }
.step.green .t { color: var(--dim); } .step.green .s { color: var(--green); }
.step.yellow { background: rgba(245, 197, 66, 0.10); }
.step.yellow .t { font-weight: 600; } .step.yellow .s { color: var(--yellow); }
.step.orange .s { color: var(--orange); } .step.red .s { color: var(--red); }
.step.grey .t { color: var(--dim); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: var(--green); } .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.dot.red { background: var(--red); } .dot.orange { background: var(--orange); }
.dot.grey { background: rgba(255,255,255,0.22); }
.phase-name { margin-left: 5px; overflow: hidden; text-overflow: ellipsis; }
#model { font-size: var(--big); font-weight: 600; flex-shrink: 1; min-width: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
#model.r-player { color: var(--player); } #model.r-judge { color: var(--judge); }
#model.r-tester { color: var(--tester); } #model.r-gate { color: var(--gate); }
#meta, #age { color: var(--dim); flex-shrink: 0; }
#plus { flex-shrink: 0; }
#age.age-yellow { color: var(--yellow); } #age.age-red { color: var(--red); }
.btn {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--big); line-height: 1; color: var(--dim); cursor: pointer;
  background: var(--faint);
}
.btn:hover { background: rgba(255,255,255,0.22); color: var(--text); }
#plus { display: none; width: auto; padding: 0 6px; font-size: var(--small); }
/* the log of the fight takes all the room there is */
#detail {
  display: flex; flex: 1; min-height: 0; flex-direction: column;
  border-top: 1px solid var(--faint); padding-top: 6px;
}
#log .r-player { color: var(--player); text-shadow: 0 0 6px rgba(90,200,250,0.55); }
#log .r-judge { color: var(--judge); text-shadow: 0 0 6px rgba(195,139,255,0.55); }
#log .r-tester { color: var(--tester); text-shadow: 0 0 6px rgba(255,143,200,0.55); }
#log .r-gate { color: var(--gate); text-shadow: 0 0 6px rgba(255,179,92,0.45); }
#log .tool { opacity: 0.6; text-shadow: none; }
#log {
  flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  color: #aeb7c6;
  -webkit-user-select: text; user-select: text;
}
/* bottom: who acts and the newest line running beside it; a fresh verdict glows green/red */
#foot {
  display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0;
  padding: 4px 8px; border-radius: 7px; border: 1px solid var(--faint);
}
#who { display: none; font-weight: 600; flex-shrink: 0; line-height: calc(var(--big) * 1.4); }
#who.r-player { color: var(--player); text-shadow: 0 0 6px rgba(90,200,250,0.6); }
#who.r-judge { color: var(--judge); text-shadow: 0 0 6px rgba(195,139,255,0.6); }
#who.r-tester { color: var(--tester); text-shadow: 0 0 6px rgba(255,143,200,0.6); }
#who.r-gate { color: var(--gate); text-shadow: 0 0 6px rgba(255,179,92,0.6); }
#foot.r-player { border-color: var(--player); box-shadow: 0 0 10px rgba(90,200,250,0.3); }
#foot.r-judge { border-color: var(--judge); box-shadow: 0 0 10px rgba(195,139,255,0.3); }
#foot.r-tester { border-color: var(--tester); box-shadow: 0 0 10px rgba(255,143,200,0.3); }
#foot.r-gate { border-color: var(--gate); box-shadow: 0 0 10px rgba(255,179,92,0.3); }
/* the ticker grows to fit the whole text, the log gives way; only when the window
   itself is too short the newest tail stays and the top fades */
#doing {
  flex: 1; min-width: 0; font-size: var(--big);
  white-space: pre-wrap; word-break: break-word;
  max-height: calc(100vh - 58px); overflow: hidden;
}
#doing.cut { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 1.2em); }
#foot.bad, #foot.bad #who {
  color: var(--red); border-color: var(--red); background: rgba(255, 107, 107, 0.14);
  box-shadow: 0 0 12px rgba(255, 107, 107, 0.45); text-shadow: 0 0 6px rgba(255, 107, 107, 0.6);
}
#foot.good, #foot.good #who {
  color: var(--green); border-color: var(--green); background: rgba(61, 220, 132, 0.12);
  box-shadow: 0 0 12px rgba(61, 220, 132, 0.45); text-shadow: 0 0 6px rgba(61, 220, 132, 0.6);
}
#foot.bad #who, #foot.good #who { background: none; box-shadow: none; }
/* narrow window, what goes first: age (a quiet run turns the light yellow anyway),
   then the phase name (dots stay, the name is in their tooltip), then round and time.
   light, status, dots, model and the ticker always stay */
/* the host (Claude Code over the run) in the log: warm sand, not a run role */
#log .r-host { color: var(--host); text-shadow: 0 0 6px rgba(232,196,138,0.45); }
/* phone (source.js sets data-host="phone"): the page scrolls, the card is a block
   about half the screen, the log scrolls inside it; mac-only controls are gone */
html[data-host="phone"], html[data-host="phone"] body { background: #0f1218; overflow: auto; height: auto; }
html[data-host="phone"] body { -webkit-user-select: text; user-select: text; padding: 10px 10px 40px; }
html[data-host="phone"] #card { height: 55vh; width: auto; margin: 0 0 10px; }
html[data-host="phone"] #light { cursor: default; }
html[data-host="phone"] #light:hover { transform: none; }
html[data-host="phone"] #plus, html[data-host="phone"] #close { display: none !important; }
/* the blocks pult.js puts above (#pult-top: question or outcome) and below (#pult)
   the card share the card's font and two sizes; the question is the big thing */
html[data-host="phone"] #pult-top, html[data-host="phone"] #pult { color: var(--text); font-size: var(--small); }
html[data-host="phone"] #pult-top section, html[data-host="phone"] #pult section { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.05); }
html[data-host="phone"] #pult section section { margin: 8px 0 0; padding: 0; background: none; }
html[data-host="phone"] #pult-top h2, html[data-host="phone"] #pult h2, html[data-host="phone"] #pult-top h1 { font-size: var(--small); font-weight: 600; color: var(--dim); text-transform: lowercase; margin: 0 0 4px; }
html[data-host="phone"] #question p:first-of-type { font-size: var(--big); line-height: 1.35; }
html[data-host="phone"] .qid { color: var(--dim); }
html[data-host="phone"] #pult-top p, html[data-host="phone"] #pult p, html[data-host="phone"] #pult li { margin: 2px 0; line-height: 1.35; }
html[data-host="phone"] #pult ul { list-style: none; }
html[data-host="phone"] #pult a { color: var(--player); text-decoration: none; }
html[data-host="phone"] button { font: inherit; font-size: var(--big); color: var(--text); background: rgba(255,255,255,0.10); border: 1px solid var(--faint); border-radius: 10px; padding: 8px 14px; margin: 6px 6px 0 0; min-height: 40px; }
html[data-host="phone"] button[data-action="stop"] { color: var(--red); }
html[data-host="phone"] textarea, html[data-host="phone"] select, html[data-host="phone"] input { font: inherit; font-size: var(--big); color: var(--text); background: rgba(0,0,0,0.25); border: 1px solid var(--faint); border-radius: 10px; padding: 8px 10px; margin: 8px 0 0; width: 100%; display: block; }
html[data-host="phone"] textarea { min-height: 72px; resize: vertical; }
@media (max-width: 440px) { #age { display: none; } }
@media (max-width: 380px) { .phase-name { display: none; } #model { max-width: none; } }
@media (max-width: 320px) { #meta { display: none; } }
/* short window: the log goes first, then the ticker keeps its newest tail */
@media (max-height: 179px) { #detail { display: none; } }
</style>
</head>
<body>
<div id="card">
  <div id="top">
    <span id="light" title="спрятать в трей"></span>
    <span id="close" class="btn" title="закрыть HUD">✕</span>
    <span id="status"></span>
    <div id="phases"></div>
    <span id="model"></span>
    <span id="meta"></span>
    <span id="age"></span>
    <span id="plus" class="btn" title="другой прогон"></span>
  </div>
  <div id="plan"></div>
  <div id="detail">
    <div id="log"></div>
  </div>
  <div id="foot"><span id="who"></span><div id="doing"></div></div>
</div>
<script>
/*render:start*/
var ROLE_NAMES = {player: "игрок", judge: "судья", tester: "тестер", gate: "тесты", host: "хозяин"};
var VERDICT_SHOW_S = 60;
var LOG_SHOW = 80;
function nowS(d) { return (window.teroNow ? window.teroNow() : Date.now() / 1000); }
function since(d, at) { return at == null ? null : Math.max(0, Math.floor(nowS(d) - at)); }
// age bucket of the newest event: quiet runs turn the age yellow, then red
function ageColor(age) {
  if (age == null) return "normal";
  if (age > 300) return "red";
  if (age > 60) return "yellow";
  return "normal";
}
function mss(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function mmss(s) { s = Math.max(0, Math.floor(s || 0)); return ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2); }
// the gate timer ticks on the screen: the model gives the absolute start
function doingOf(d) {
  if (d.role === "gate" && d.gate_started_at != null && d.light !== "red" && d.light !== "ready") {
    return "⏱ тесты идут " + mss(nowS(d) - d.gate_started_at);
  }
  return d.doing || "";
}
// [who, text, class]: a stop, a fresh verdict or "done" win over the acting role's newest line
function footOf(d, acting) {
  if (d.stop_text) return ["", d.stop_text, "bad"];
  var v = d.verdict || {};
  var vAge = since(d, d.verdict_at);
  var fresh = vAge != null && vAge < VERDICT_SHOW_S;
  if (v.verdict && (fresh || !acting)) {
    var cls = v.verdict === "SHIP" ? "good" : "bad";
    return ["судья", v.verdict + (v.blocking ? " · блокеров " + v.blocking : "") + (v.first ? " · " + v.first : ""), cls];
  }
  if (d.done_text) return ["", d.done_text, "good"];
  return [acting ? ROLE_NAMES[acting] : "", doingOf(d), acting ? "r-" + acting : ""];
}
// keep the newest tail in sight; fade the top edge when older text is cut off
function pinTail(el) {
  el.scrollTop = el.scrollHeight;
  if (el.classList) el.classList.toggle("cut", el.scrollHeight > el.clientHeight + 1);
}
// the newest line types itself out; never longer than ~1 s
var typing = {target: "", shown: 0, timer: null};
function typeDoing(text) {
  var el = document.getElementById("doing");
  if (text === typing.target) { pinTail(el); return; }
  var keep = text.indexOf(typing.target.slice(0, typing.shown)) === 0 ? typing.shown : 0;
  typing.target = text;
  typing.shown = keep;
  if (typing.timer) clearInterval(typing.timer);
  var step = Math.max(1, Math.ceil((text.length - keep) / 50));
  typing.timer = setInterval(function () {
    typing.shown = Math.min(text.length, typing.shown + step);
    el.textContent = text.slice(0, typing.shown) + (typing.shown < text.length ? "▍" : "");
    pinTail(el);
    if (typing.shown >= text.length) { clearInterval(typing.timer); typing.timer = null; }
  }, 20);
}
var STEP_STATE = {green: "готово", orange: "с долгом", red: "стоп", grey: "впереди"};
var planKey = "";
function renderPlan(secs, d) {
  var round = d.round ? String(d.round) : "";
  var key = JSON.stringify(secs) + round;
  if (key === planKey) return;
  planKey = key;
  var plan = document.getElementById("plan");
  plan.innerHTML = "";
  for (var i = 0; i < secs.length; i++) {
    var c = secs[i].color || "grey";
    var row = document.createElement("div");
    row.className = "step " + c;
    var dot = document.createElement("span");
    dot.className = "dot " + c;
    var n = document.createElement("span");
    n.className = "n"; n.textContent = i + 1;
    var t = document.createElement("span");
    t.className = "t"; t.textContent = secs[i].title || "";
    var st = document.createElement("span");
    st.className = "s";
    st.textContent = c === "yellow" ? "идёт" + (round ? " · раунд " + round : "") : (STEP_STATE[c] || "");
    row.appendChild(n); row.appendChild(dot); row.appendChild(t); row.appendChild(st);
    plan.appendChild(row);
  }
}
function ago(s) {
  return s < 60 ? s + " с" : Math.floor(s / 60) + " мин";
}
var logFilter = "";  // "" all roles, "host" only the host (the phone's «только хозяин»)
function render(d) {
  if (!d) return;
  var light = d.light || "grey";
  document.getElementById("light").className = light;
  document.getElementById("close").style.display = light === "ready" && !window.teroSource ? "flex" : "none";
  // a green dot says "working" by itself: words only when something needs a look
  var st = document.getElementById("status");
  st.className = light;
  st.textContent = light === "green" ? "" : (d.light_text || "");
  var acting = ROLE_NAMES[d.role] && (d.light === "green" || d.light === "yellow") ? d.role : "";

  var secs = d.sectors || [];
  var ph = document.getElementById("phases");
  ph.innerHTML = "";
  var curTitle = null;
  for (var j = 0; j < secs.length; j++) {
    var dot = document.createElement("span");
    dot.className = "dot " + (secs[j].color || "grey");
    dot.title = (j + 1) + ". " + (secs[j].title || "");
    ph.appendChild(dot);
    if (secs[j].color === "yellow") curTitle = secs[j].title || "";
  }
  renderPlan(secs, d);
  if (curTitle !== null) {
    var label = document.createElement("span");
    label.className = "phase-name";
    label.textContent = curTitle;
    label.title = curTitle;
    ph.appendChild(label);
  }

  // "player · opus": the role is on the bottom chip, the model gets its own place
  var model = document.getElementById("model");
  model.textContent = String(d.role_line || "").split(" · ").slice(1).join(" · ");
  model.className = acting ? "r-" + acting : "";
  // "р1 · 22:07": round and time in the phase; the phase itself is in the dots
  var meta = [];
  if (d.round) meta.push("р" + d.round);
  if (d.phase_started_at != null) meta.push(mmss(nowS(d) - d.phase_started_at));
  document.getElementById("meta").textContent = meta.join(" · ");
  var age = document.getElementById("age");
  var lastAge = since(d, d.last_event_at);
  age.textContent = (lastAge == null) ? "" : ago(lastAge);
  age.title = "с последнего события";
  age.className = "age-" + ageColor(lastAge);

  var f = footOf(d, acting);
  var who = document.getElementById("who");
  who.textContent = f[0];
  who.className = acting ? "r-" + acting : "";
  who.style.display = f[0] ? "inline" : "none";
  document.getElementById("foot").className = f[2];
  typeDoing(f[1]);

  var plus = document.getElementById("plus");
  plus.textContent = d.plus || "";
  plus.style.display = d.plus ? "flex" : "none";

  var items = d.log || [];
  if (logFilter) items = items.filter(function (it) { return it.role === logFilter; });
  var log = document.getElementById("log");
  var atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  var frag = document.createDocumentFragment();
  for (var m = Math.max(0, items.length - LOG_SHOW); m < items.length; m++) {
    var line = document.createElement("div");
    var r = items[m].role;
    // agent speech glows in its role color, tool calls stay dim
    line.className = (ROLE_NAMES[r] ? "r-" + r : "") + (items[m].type === "tool" ? " tool" : "");
    line.textContent = items[m].text || items[m].type || "";
    frag.appendChild(line);
  }
  log.innerHTML = "";
  log.appendChild(frag);
  if (atBottom) log.scrollTop = log.scrollHeight;
}
/*render:end*/
var lastW = null, lastH = null;
var api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
function getApi() {
  if (!api && window.pywebview && window.pywebview.api) api = window.pywebview.api;
  return api;
}
function call(name) {
  // pywebview counts every js argument, undefined included
  var a = getApi();
  if (!a || !a[name]) return null;
  try { return a[name].apply(a, [].slice.call(arguments, 1)); } catch (e) { return null; }
}
function after(p, fn) {
  if (p && typeof p.then === "function") p.then(fn); else fn(p);
}
function poll() {
  // the phone sets window.teroSource (source.js) before this script runs: the
  // same card, another feed; only without it the pywebview bridge is used
  if (window.teroSource) {
    after(window.teroSource.view(), function (d) { if (d) { window._last = d; render(d); } });
    return;
  }
  var a = getApi();
  if (!a) return;
  after(call("view"), function (d) { if (d) { window._last = d; render(d); } });
  if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
    lastW = window.innerWidth; lastH = window.innerHeight;
    call("save_size", lastW, lastH);
  }
}
if (!window.teroSource) window.addEventListener("pywebviewready", function () { getApi(); poll(); });
document.getElementById("plus").onclick = function () {
  var a = getApi();
  if (!a) return;
  try { after(a.switch(""), poll); } catch (e) {}
};
document.getElementById("light").onclick = function () { if (!window.teroSource) call("toggle_visible"); };
document.getElementById("close").onclick = function () { call("close"); };
// a click on the phases opens the plan, any other click closes it
document.addEventListener("click", function (e) {
  var plan = document.getElementById("plan");
  var onPhases = document.getElementById("phases").contains(e.target);
  if (onPhases) plan.classList.toggle("open");
  else if (!plan.contains(e.target)) plan.classList.remove("open");
});
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
