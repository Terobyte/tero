* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body {
  font-family: "TeroGlass", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color: #f2f4f8;
  -webkit-user-select: none;
  user-select: none;
}
#card {
  background: rgba(18, 22, 30, 0.55);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 16px;
  padding: 10px 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}
#row { display: flex; align-items: center; gap: 10px; }
#circle {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; flex-shrink: 0;
  border: 2px solid rgba(255, 255, 255, 0.25);
}
#meta { min-width: 0; flex: 1; }
#header { font-size: 12px; opacity: 0.9; white-space: nowrap; }
#header .age-normal { color: #9aa3b2; }
#header .age-yellow { color: #f5c542; }
#header .age-red { color: #ff6b6b; }
#role { font-size: 11px; color: #9aa3b2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#doing { font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#detail { display: none; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 8px; }
#phases { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.dot.green { background: #3ddc84; } .dot.yellow { background: #f5c542; }
.dot.red { background: #ff6b6b; } .dot.orange { background: #ff9f43; }
.dot.grey { background: #555b66; }
#tabs { display: flex; gap: 4px; margin-bottom: 4px; }
#tabs button {
  background: rgba(255,255,255,0.08); color: #cfd6e2; border: none;
  border-radius: 6px; font-size: 10px; padding: 2px 6px; cursor: pointer;
}
#tabs button.on { background: rgba(255,255,255,0.22); color: #fff; }
#log { font-size: 10px; color: #aeb7c6; max-height: 90px; overflow-y: auto; white-space: pre-wrap; }
#foot { font-size: 11px; margin-top: 6px; color: #ffd479; }
#plus {
  display: none; align-self: flex-start; font-size: 10px; color: #cfd6e2; cursor: pointer;
  background: rgba(255,255,255,0.12); border-radius: 999px; padding: 1px 7px;
}
</style>
</head>
<body>
<div id="card">
  <div id="row">
    <div id="circle">❓</div>
    <div id="meta">
      <div id="header"></div>
      <div id="role"></div>
      <div id="doing"></div>
    </div>
    <span id="plus"></span>
  </div>
  <div id="detail">
    <div id="phases"></div>
    <div id="tabs"></div>
    <div id="log"></div>
    <div id="foot"></div>
  </div>
</div>
<script>
var expanded = false;
var tab = "all";
var lastX = null, lastY = null;
var api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
function getApi() {
  if (!api && window.pywebview && window.pywebview.api) api = window.pywebview.api;
  return api;
}
window.addEventListener("pywebviewready", function () { getApi(); poll(); });

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function sectorColor(v) {
  var map = {green: "#3ddc84", yellow: "#f5c542", red: "#ff6b6b", orange: "#ff9f43", grey: "#555b66"};
  return map[v] || "#555b66";
}
function render(d) {
  if (!d) return;
  expanded = !!d.expanded;
  var circle = document.getElementById("circle");
  circle.textContent = d.icon || "❓";
  var secs = d.sectors || [];
  if (secs.length) {
    var n = secs.length, parts = [];
    for (var i = 0; i < n; i++) {
      parts.push(sectorColor(secs[i].color) + " " + (i * 100 / n) + "% " + ((i + 1) * 100 / n) + "%");
    }
    circle.style.background = "conic-gradient(" + parts.join(", ") + ")";
  } else {
    circle.style.background = sectorColor(d.circle);
  }
  var ageTxt = (d.last_event_age_s == null) ? "" : (" · " + d.last_event_age_s + " с");
  var ageCls = "age-" + (d.age_color || "normal");
  document.getElementById("header").innerHTML = esc(d.header || "") +
    '<span class="' + ageCls + '">' + esc(ageTxt) + "</span>";
  document.getElementById("role").textContent = d.role_line || "";
  document.getElementById("doing").textContent = d.doing || "";
  var plus = document.getElementById("plus");
  plus.textContent = d.plus || "";
  plus.style.display = d.plus ? "inline-block" : "none";
  var detail = document.getElementById("detail");
  detail.style.display = expanded ? "block" : "none";
  if (!expanded) return;
  var ph = document.getElementById("phases");
  ph.innerHTML = "";
  for (var j = 0; j < secs.length; j++) {
    var item = document.createElement("span");
    item.className = "phase";
    var d2 = document.createElement("span");
    d2.className = "dot " + (secs[j].color || "grey");
    d2.title = secs[j].title || "";
    item.appendChild(d2);
    var label = document.createElement("span");
    label.className = "phase-name";
    label.textContent = secs[j].title || "";
    item.appendChild(label);
    ph.appendChild(item);
  }
  var names = [["all", "all"], ["player", "player"], ["judge", "judge"], ["tester", "tester"], ["gate", "тесты"]];
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (var k = 0; k < names.length; k++) {
    (function (key, label) {
      var b = document.createElement("button");
      b.textContent = label;
      if (key === tab) b.className = "on";
      b.onclick = function () { tab = key; if (window._last) render(window._last); };
      tabs.appendChild(b);
    })(names[k][0], names[k][1]);
  }
  var items = ((d.tabs || {})[tab]) || [];
  var lines = [];
  for (var m = Math.max(0, items.length - 30); m < items.length; m++) {
    lines.push(items[m].text || items[m].type || "");
  }
  document.getElementById("log").textContent = lines.join("\n");
  var foot = "";
  if (d.stop_text) foot = d.stop_text;
  else {
    var v = d.verdict || {};
    if (v.verdict) foot = v.verdict + (v.first ? " · " + v.first : "");
    else if (d.done_text) foot = d.done_text;
  }
  document.getElementById("foot").textContent = foot;
}
function poll() {
  var a = getApi();
  if (!a) return;
  try {
    var p = a.view();
    if (p && typeof p.then === "function") p.then(function (d) { window._last = d; render(d); });
    else { window._last = p; render(p); }
  } catch (e) {}
  try {
    if (window.screenX !== lastX || window.screenY !== lastY) {
      lastX = window.screenX; lastY = window.screenY;
      a.save_pos(lastX, lastY);
    }
  } catch (e) {}
}
document.getElementById("plus").onclick = function () {
  var a = getApi();
  if (!a) return;
  try {
    var p = a.switch("");
    if (p && typeof p.then === "function") p.then(function () { poll(); });
    else poll();
  } catch (e) {}
};
document.getElementById("circle").onclick = function () {
  var a = getApi();
  if (!a) {
    expanded = !expanded;
    try {
      var w = window.pywebview;
      if (w && w.resize) w.resize(340, expanded ? 340 : 120);
    } catch (e) {}
    return;
  }
  try {
    var p = a.toggle();
    if (p && typeof p.then === "function") p.then(function (v) { expanded = !!v; poll(); });
    else poll();
  } catch (e) {}
};
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
