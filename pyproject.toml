[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g3-coach"
version = "0.1.0"
description = "G3 Coach-Player: dual-agent orchestration system"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
tero = "g3:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "g3*"]
