[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tero"
version = "0.1.0"
description = "tero: plan-driven player → judge loop over coding-agent CLIs"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.0",
    "questionary>=2.0",
    "jsonschema>=4.0",
]

[project.scripts]
tero = "src.cli_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
