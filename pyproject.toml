[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g3-coach"
version = "0.1.0"
description = "G3 Coach-Player: dual-agent orchestration system"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.0",
    "astroid>=3.0",
    "astunparse>=1.6",
    "astor>=0.8",
    "graphviz>=0.20",
    "questionary>=2.0",
]

[project.scripts]
tero = "src.cli_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "g3*"]
